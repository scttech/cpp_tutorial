# Domain badges: finish every challenge of a domain track at the Works tier. Badges for domains that are not written yet are
# shown as "coming soon" automatically, so adding a domain needs no badge work.

- id: game-dev
  name: "Game Dev"
  category: domain
  icon: "🎮"
  description: "Reach the Works tier on every Games challenge."
  rule: { type: track-complete, module: domain.games, tier: works }

- id: quant
  name: "Quant"
  category: domain
  icon: "📈"
  description: "Reach the Works tier on every Finance challenge."
  rule: { type: track-complete, module: domain.finance, tier: works }

