ladder:
  - level: 1
    text: "State: the step and max steps, an accumulator (Duration), the reference time last_, a bool started_, and three counters. frame(): now = clock.now(); if not started_: remember it and return 0. Otherwise dt = now - last_; last_ = now; add dt to the accumulator only if dt is positive."
  - level: 2
    text: "Then a loop: while (acc >= step && run < max_steps) { update(step); acc -= step; ++run; }. After it, if acc is still >= step you hit the cap: the whole steps that are left are dropped: whole = acc / step (an integer), dropped += whole, acc -= step * whole. Never run them later. steps_total counts the updates that ran; simulated_time is step * steps_total."
  - level: 3
    text: "Guard the odd cases: a step <= 0 returns 0 right after the accumulation (or before the loop), max steps below 1 becomes 1 in the constructor. alpha() = double(acc.count()) / double(step.count()) when step > 0. reset(clock): last_ = clock.now(); started_ = true; acc = 0 (the counters are kept)."
