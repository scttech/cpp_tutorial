id: domain.networking.dns
title: "DNS Messages and Name Compression"
module: domain.networking
type: challenge
estimatedMinutes: 90
concepts: [dns, wire-format, name-compression, compression-pointers, pointer-loops, bounds-checking, big-endian, untrusted-input, std-optional, round-trip]
prerequisites: []
files:
  editable: [dns.hpp]
  readonly: [types.hpp, main.cpp]
flags: ["-std=c++20", "-Wall", "-Wextra"]
limits: { wallMs: 10000, memoryMb: 256 }
requires: []
tiers: { works: true, robust: true, fast: true, clean: true }
