id: core.testing.test-out
title: "Test-out: Test the Stack"
module: core.testing
type: test-out
estimatedMinutes: 30
concepts: [unit-test, arrange-act-assert, googletest, test-fixture, expect-vs-assert, expect-throw, edge-cases, boundary-values, mutation-testing]
prerequisites: [core.inherit.capstone-plugin-pipeline]
files:
  editable: [stack_test.cpp]
  readonly: [stack.hpp]
flags: ["-std=c++20", "-Wall", "-Wextra"]
libs: [gtest]
grader: variants
limits: { wallMs: 5000, memoryMb: 256 }
requires: [testing-tools]
tiers: { works: true, robust: true, fast: false, clean: true }
gotchas: [test-checks-nothing, only-the-happy-path, one-push-cannot-tell-first-from-last, forgot-the-empty-stack, forgot-the-full-stack, expect-throw-with-the-wrong-type, test-depends-on-another-test, magic-numbers]
