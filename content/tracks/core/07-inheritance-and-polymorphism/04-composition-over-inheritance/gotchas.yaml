fragile-base-class:
  title: "A fragile base class: a change in the base breaks derived classes"
  text: "When a derived class relies on how the base calls its own virtual functions, an innocent change in the base (such as `add_all` no longer calling `add`) silently changes the derived behavior. Composition has no such coupling."
  demo:
    bad:
      code: |
        #include <iostream>
        #include <vector>

        struct Bag {
            int size = 0;
            virtual void add(int) { ++size; }
            virtual void add_all(const std::vector<int>& v) { for (int x : v) add(x); }   // calls the virtual add
            virtual ~Bag() = default;
        };
        struct Counting : Bag {
            int adds = 0;
            void add(int x) override { ++adds; Bag::add(x); }
            void add_all(const std::vector<int>& v) override { adds += static_cast<int>(v.size()); Bag::add_all(v); }
        };

        int main() {
            Counting c;
            c.add_all({1, 2, 3});
            std::cout << c.adds << "\n";   // 3 elements, counted twice
        }
      out: "6\n"
    fix:
      code: |
        #include <iostream>
        #include <vector>

        struct Bag {
            int size = 0;
            void add(int) { ++size; }
            void add_all(const std::vector<int>& v) { for (int x : v) add(x); }
        };
        struct Counting {                 // composition: holds a Bag, does not inherit from it
            Bag bag;
            int adds = 0;
            void add(int x) { ++adds; bag.add(x); }
            void add_all(const std::vector<int>& v) { adds += static_cast<int>(v.size()); bag.add_all(v); }
        };

        int main() {
            Counting c;
            c.add_all({1, 2, 3});
            std::cout << c.adds << "\n";
        }
      out: "3\n"
base-method-calls-an-overridable-method:
  title: "A base method that calls an overridable one"
  text: "If `Bag::add_all` calls the virtual `add`, an override of `add` in a derived class is also called for every element of `add_all`. Document it, or call a non-virtual helper."
