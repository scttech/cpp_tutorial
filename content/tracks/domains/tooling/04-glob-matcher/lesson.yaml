id: domain.tooling.glob-matcher
title: "A Glob Matcher That Cannot Be Made to Backtrack"
module: domain.tooling
type: challenge
estimatedMinutes: 95
concepts: [glob, pattern-matching, nfa-simulation, thompson-construction, catastrophic-backtracking, path-segments, dotfiles, brace-alternation, character-classes, compile-once-match-many]
prerequisites: []
files:
  editable: [glob.hpp]
  readonly: [main.cpp]
flags: ["-std=c++20", "-Wall", "-Wextra"]
limits: { wallMs: 10000, memoryMb: 256 }
requires: []
tiers: { works: true, robust: true, fast: true, clean: true }
gotchas: [star-does-not-cross-slash, double-star-is-a-whole-segment, leading-dot-must-be-explicit, no-exponential-backtracking, iterative-closure-no-recursion-on-input, sets-and-ranges, brace-alternatives, invalid-patterns-are-reported]
