      // lx =  cos(theta) * dx + sin(theta) * dy;      ly = -sin(theta) * dx + cos(theta) * dy;
      // d2 = lx * lx + ly * ly;   kappa = d2 < 1e-12 ? 0 : 2 * ly / d2;
      // if (lx < 0) kappa = ly >= 0 ? kmax : -kmax;   kappa = clamp(kappa, -kmax, kmax);
