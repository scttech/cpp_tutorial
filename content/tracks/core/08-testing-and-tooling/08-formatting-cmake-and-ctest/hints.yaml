ladder:
  - level: 1
    text: "Two files, two jobs. format.yaml: look at style_sample.cpp and list what you see (how far lines are indented, where the opening brace of a function is, where the `*` of a pointer parameter sits, how many spaces come before `// how many are in the cart`, whether a function ever fits on one line, where long calls are wrapped), then add one option per observation and press Run Tests. CMakeLists.txt: replace each old global command by a target command."
  - level: 2
    text: "Options to look up: IndentWidth, ColumnLimit (look at the longest lines of the sample), BreakBeforeBraces, PointerAlignment, AllowShortFunctionsOnASingleLine, AllowShortIfStatementsOnASingleLine, SpacesBeforeTrailingComments. The access specifiers (`public:`) sit two spaces in: that is what the base style does with a width of 4, so you do not need an option for it. CMake: include_directories becomes target_include_directories(greeter PUBLIC include); add_definitions(-Wall -Wextra) becomes target_compile_options(<each target> PRIVATE -Wall -Wextra); link_libraries(greeter) becomes target_link_libraries(app PRIVATE greeter)."
  - level: 3
    text: "The braces are on their own lines: BreakBeforeBraces: Allman. The pointer star hugs the type: PointerAlignment: Left. The indentation is 4 and the wrapped calls end before column 100. Trailing comments have two spaces in front. For the tests: enable_testing(), find_package(GTest REQUIRED), add_executable(greeter_tests tests/greeter_test.cpp), target_link_libraries(greeter_tests PRIVATE greeter GTest::gtest_main), include(GoogleTest), gtest_discover_tests(greeter_tests). Set the standard with set(CMAKE_CXX_STANDARD 20) and set(CMAKE_CXX_STANDARD_REQUIRED ON)."
  - level: 4
    text: |
      # format.yaml
      BasedOnStyle: LLVM
      IndentWidth: 4
      ColumnLimit: 100
      BreakBeforeBraces: Allman
      AllowShortFunctionsOnASingleLine: None
      AllowShortIfStatementsOnASingleLine: Never
      PointerAlignment: Left
      SpacesBeforeTrailingComments: 2

      # CMakeLists.txt (the shape)
      cmake_minimum_required(VERSION 3.16)
      project(greeter VERSION 1.0 LANGUAGES CXX)
      set(CMAKE_CXX_STANDARD 20) ... set(CMAKE_EXPORT_COMPILE_COMMANDS ON)
      add_library(greeter src/greeter.cpp)
      target_include_directories(greeter PUBLIC include)
      add_executable(app app/main.cpp)
      target_link_libraries(app PRIVATE greeter)
