ladder:
  - level: 1
    text: "Run it and read main.cpp's numbers: doubling the input quadruples the operations. Trying every pair is the problem. What if the numbers were SORTED? For a number at the left end and one at the right end, their sum is either too small (move the left end right), too big (move the right end left) or exactly the target."
  - level: 2
    text: "Sort a COPY of the vector, then walk two positions, `left` from the start and `right` from the end, while left < right. Compare `sum = sorted[left] + sorted[right]` with `target` using only `<` and `==`. The tricky part is a sum that matches: equal values come in runs, so count the whole run at once."
  - level: 3
    text: "On a match there are two cases. If sorted[left] == sorted[right], everything between them is equal: with m = right - left + 1 values there are m * (m - 1) / 2 pairs, and you are done. Otherwise measure the run of values equal to sorted[left] (call its length a) and the run equal to sorted[right] (length b): that is a * b pairs; jump left past its run and right before its run."
  - level: 4
    text: |
      if (values.size() < 2) return 0;
      std::vector<T> sorted = values;            // a copy
      std::sort(sorted.begin(), sorted.end());
      long long pairs = 0;
      std::size_t left = 0, right = sorted.size() - 1;
      while (left < right) {
          const T sum = sorted[left] + sorted[right];
          if (sum < target) ++left;
          else if (target < sum) --right;
          else if (sorted[left] == sorted[right]) { m = right - left + 1; pairs += m * (m - 1) / 2; break; }
          else { /* a = length of the left run, b = length of the right run */ pairs += a * b; /* skip both runs */ }
      }
      return pairs;
