id: core.ownership.capstone-vector
title: "Capstone: Your own vector"
module: core.ownership
type: capstone
estimatedMinutes: 100
concepts: [rule-of-five, dynamic-array, capacity-and-size, geometric-growth, amortized-cost, aliasing, iterator-pointers, initializer-list, brace-vs-paren-initialization, sanitizers, allocation-counting]
prerequisites: [core.ownership.find-the-bug]
files:
  editable: [int_vector.hpp]
  readonly: [main.cpp]
flags: ["-std=c++20", "-Wall", "-Wextra", "-fsanitize=address,undefined"]
limits: { wallMs: 8000, memoryMb: 256 }
requires: [sanitizers]
tiers: { works: true, robust: true, fast: true, clean: true }
gotchas: [shallow-copy, double-free, self-assignment, push-back-of-own-element, insert-of-own-element, growth-by-one, reserve-shrinks, shrink-to-fit-keeps-capacity, clear-frees-capacity, brace-initialization-picks-initializer-list, move-not-noexcept, off-by-one-on-erase, std-container-inside]
