      //     reachable = found && (world.inventory.count(noun) || (lit && room.items.count(noun)))
      //     !reachable -> problem = lit ? "You don't see that here." : "You can't see anything."
      // is_lit: the room is not dark, or some item in world.inventory or room.items has a Switch state that is on.
      // Door state: if (auto* door = std::get_if<Door>(&item->state)) { switch (door->lock) {...} }
