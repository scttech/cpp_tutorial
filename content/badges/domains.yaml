- id: domain-polyglot
  name: "Domain Polyglot"
  category: domain
  icon: "🌍"
  description: "Complete at least one challenge in every domain track."
  rule:
    type: all
    rules:
      - { type: lesson-count, where: { module: domain.games, status: complete }, atLeast: 1 }
      - { type: lesson-count, where: { module: domain.finance, status: complete }, atLeast: 1 }
      - { type: lesson-count, where: { module: domain.systems, status: complete }, atLeast: 1 }
      - { type: lesson-count, where: { module: domain.embedded, status: complete }, atLeast: 1 }
      - { type: lesson-count, where: { module: domain.data, status: complete }, atLeast: 1 }
      - { type: lesson-count, where: { module: domain.networking, status: complete }, atLeast: 1 }
      - { type: lesson-count, where: { module: domain.graphics, status: complete }, atLeast: 1 }
      - { type: lesson-count, where: { module: domain.tooling, status: complete }, atLeast: 1 }
