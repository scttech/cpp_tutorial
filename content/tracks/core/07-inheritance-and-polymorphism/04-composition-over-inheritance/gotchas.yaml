            void add(int x) override { ++adds; Bag::add(x); }
            void add_all(const std::vector<int>& v) override { adds += static_cast<int>(v.size()); Bag::add_all(v); }
        };

        int main() {
            Counting c;
            c.add_all({1, 2, 3});
            std::cout << c.adds << "\n";   // 3 elements, counted twice
        }
      out: "6\n"
    fix:
      code: |
        #include <iostream>
        #include <vector>

        struct Bag {
            int size = 0;
            void add(int) { ++size; }
            void add_all(const std::vector<int>& v) { for (int x : v) add(x); }
