return-reference-to-local:
  title: "Never return a reference to a local"
  text: "The local dies when the function returns, leaving a dangling reference, and using it is undefined behavior. Return by value, or return a reference to something that outlives the call."
  demo:
    bad:
      code: |
        const int& answer() {
            int result = 42;
            return result;   // result dies at the closing brace
        }

        int main() {
            answer();
        }
      warns: "local"
    fix:
      code: |
        #include <iostream>

        int answer() {   // return by value
            int result = 42;
            return result;
        }

        int main() {
            std::cout << answer() << "\n";
        }
      out: "42\n"
string-view-of-temporary:
  title: "A `string_view` of a temporary dangles"
  text: "A view of a temporary `std::string` dangles as soon as that temporary dies, at the end of the statement, and reading it is undefined behavior. Keep the string in a named variable for as long as the view is used."
  demo:
    sanitize: true
    bad:
      code: |
        #include <iostream>
        #include <string>
        #include <string_view>

        std::string make() { return "a string that is long enough to live on the heap"; }

        int main() {
            std::string_view view = make();   // the temporary string dies at the semicolon
            std::cout << view << "\n";
        }
      reports: "heap-use-after-free"
    fix:
      code: |
        #include <iostream>
        #include <string>
        #include <string_view>

        std::string make() { return "a string that is long enough to live on the heap"; }

        int main() {
            std::string text = make();         // something that owns the characters
            std::string_view view = text;
            std::cout << view << "\n";
        }
      out: "a string that is long enough to live on the heap\n"
c-str-of-temporary:
  title: "`c_str()` of a temporary dangles"
  text: "`const char* p = make_string().c_str();` points into a string that dies at the semicolon. Keep the string in a named variable for as long as you use the pointer."
  demo:
    sanitize: true
    bad:
      code: |
        #include <iostream>
        #include <string>

        std::string make() { return "a string that is long enough to live on the heap"; }

        int main() {
            const char* p = make().c_str();   // the string dies at the semicolon
            std::cout << p << "\n";
        }
      reports: "heap-use-after-free"
    fix:
      code: |
        #include <iostream>
        #include <string>

        std::string make() { return "a string that is long enough to live on the heap"; }

        int main() {
            std::string s = make();           // a named owner
            const char* p = s.c_str();
            std::cout << p << "\n";
        }
      out: "a string that is long enough to live on the heap\n"
erase-in-a-loop:
  title: "Erasing inside a loop invalidates the iterator"
  text: "`erase` invalidates the iterator you are using, so the next `++it` is undefined behavior, and the element after an erased one is skipped. Use the iterator `erase` returns, or the `remove` and `erase` idiom."
  demo:
    bad:
      code: |
        #include <iostream>
        #include <vector>

        int main() {
            std::vector<int> v = {1, 2, 2, 3};
            for (auto it = v.begin(); it != v.end(); ++it)
                if (*it == 2) v.erase(it);   // `it` is invalid afterwards, and the next 2 is skipped
            for (int x : v) std::cout << x << " ";
            std::cout << "\n";
        }
      out: "1 2 3 \n"
    fix:
      code: |
        #include <algorithm>
        #include <iostream>
        #include <vector>

        int main() {
            std::vector<int> v = {1, 2, 2, 3};
            v.erase(std::remove(v.begin(), v.end(), 2), v.end());   // the erase-remove idiom
            for (int x : v) std::cout << x << " ";
            std::cout << "\n";
        }
      out: "1 3 \n"
lambda-captures-local-by-reference:
  title: "A lambda can outlive the locals it captured"
  text: "`[&]` captures by reference, so a lambda that is returned or stored for later refers to variables that no longer exist. Capture by value (`[x]` or `[=]`) when the lambda escapes its scope."
  demo:
    sanitize: true
    bad:
      code: |
        #include <functional>
        #include <iostream>

        std::function<int()> make() {
            int x = 7;
            return [&] { return x; };   // x is gone when make() returns
        }

        int main() {
            auto f = make();
            std::cout << f() << "\n";
        }
      reports: "stack-use-after-return"
    fix:
      code: |
        #include <functional>
        #include <iostream>

        std::function<int()> make() {
            int x = 7;
            return [x] { return x; };   // a copy travels with the lambda
        }

        int main() {
            auto f = make();
            std::cout << f() << "\n";
        }
      out: "7\n"
two-shared-ptrs-from-one-raw-pointer:
  title: "Two `shared_ptr`s from one raw pointer double-free"
  text: "Each `shared_ptr(raw)` makes its own control block, so the object is deleted twice. Copy an existing `shared_ptr` instead, or derive from `enable_shared_from_this`."
  demo:
    sanitize: true
    bad:
      code: |
        #include <memory>

        int main() {
            int* raw = new int{1};
            std::shared_ptr<int> a(raw);
            std::shared_ptr<int> b(raw);   // a second, independent owner
        }
      reports: "double-free"
    fix:
      code: |
        #include <iostream>
        #include <memory>

        int main() {
            auto a = std::make_shared<int>(1);
            std::shared_ptr<int> b = a;   // a copy shares the same control block
            std::cout << a.use_count() << "\n";
        }
      out: "2\n"
static-buffer-instead-of-ownership:
  title: "A `static` buffer is shared by every call"
  text: "Returning a pointer to a function-local `static` buffer avoids the dangling pointer, but each call overwrites the previous result and threads race on it. Return a `std::string`."
  demo:
    bad:
      code: |
        #include <iostream>

        const char* name(int i) {
            static char buf[2];   // one buffer for every call
            buf[0] = static_cast<char>('a' + i);
            buf[1] = '\0';
            return buf;
        }

        int main() {
            const char* a = name(0);
            const char* b = name(1);
            std::cout << a << b << "\n";   // both point at the same buffer
        }
      out: "bb\n"
    fix:
      code: |
        #include <iostream>
        #include <string>

        std::string name(int i) {
            return std::string(1, static_cast<char>('a' + i));   // each call owns its result
        }

        int main() {
            std::string a = name(0);
            std::string b = name(1);
            std::cout << a << b << "\n";
        }
      out: "ab\n"
