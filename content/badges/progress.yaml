# Badge definitions are data: add a badge by adding an entry, no code change needed.
# Rule types: lesson-complete, lesson-count, module-complete, tier-complete, first-try, persistence,
#             streak-days, custom-event, same-day-count, and the combinator `all`.
# `hidden: true` shows "???" until earned. Badges whose rule references content that does not exist yet
# are listed as "coming soon" automatically.

- id: hello-world
  name: "Hello, World"
  category: progress
  icon: "👋"
  description: "Pass your first lesson."
  rule: { type: lesson-count, where: { status: complete }, atLeast: 1 }

- id: module-master-1
  name: "Module Master I"
  category: progress
  icon: "🏗️"
  description: "Complete Module 1: Foundations (by lessons or by test-out)."
  rule: { type: module-complete, module: core.foundations }

- id: module-master-2
  name: "Module Master II"
  category: progress
  icon: "🧱"
  description: "Complete Module 2: Data and Memory."
  rule: { type: module-complete, module: core.data-and-memory }

