double-counting-in-an-override:
  title: "An override that counts can count twice"
  text: "A `Counting` subclass that overrides both `add` and `add_all`, where the base `add_all` calls `add`, counts every element twice. Composition (a counter around a `Bag`) counts exactly once."
  demo:
    bad:
      code: |
        #include <iostream>
        #include <vector>

        struct Bag {
            int size = 0;
            virtual void add(int) { ++size; }
            virtual void add_all(const std::vector<int>& v) { for (int x : v) add(x); }   // calls the virtual add
            virtual ~Bag() = default;
