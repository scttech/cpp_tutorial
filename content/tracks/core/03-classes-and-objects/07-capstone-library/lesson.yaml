id: core.classes.capstone-library
title: "Capstone: Library Management"
module: core.classes
type: capstone
estimatedMinutes: 90
concepts: [class-design, encapsulation, invariants, const-correctness, enum-class, friend, namespaces, exceptions, state-machine, operator-overloading]
prerequisites: [core.classes.namespaces]
files:
  editable: [library.hpp]
  readonly: [main.cpp]
flags: ["-std=c++20", "-Wall", "-Wextra"]
limits: { wallMs: 5000, memoryMb: 128 }
requires: []
tiers: { works: true, robust: true, fast: false, clean: true }
gotchas: [partial-update-on-failure, borrower-vs-returner, off-by-one-due-day, int-overflow-in-fines, validation-order, forgotten-const, state-spread-over-several-places, using-namespace-in-header]
