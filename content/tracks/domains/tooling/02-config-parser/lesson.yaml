id: domain.tooling.config-parser
title: "A Config File Parser with Line and Column Errors"
module: domain.tooling
type: challenge
estimatedMinutes: 95
concepts: [parsing, recursive-descent, config-files, toml-subset, error-positions, string-escapes, number-grammar, std-from-chars, diagnostics, utf-8]
prerequisites: []
files:
  editable: [config.hpp]
  readonly: [types.hpp, main.cpp]
flags: ["-std=c++20", "-Wall", "-Wextra"]
limits: { wallMs: 10000, memoryMb: 256 }
requires: []
tiers: { works: true, robust: true, fast: true, clean: true }
gotchas: [report-the-right-column, no-exceptions-in-the-tokenizer, strict-number-grammar, escapes-and-control-characters, duplicate-keys, arrays-of-one-type, comments-and-newlines, render-with-a-caret]
