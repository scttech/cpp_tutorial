id: domain.tooling.structured-logger
title: "A Structured Logger with a JSON Formatter"
module: domain.tooling
type: challenge
estimatedMinutes: 100
concepts: [logging, json, string-escaping, utf-8-validation, timestamps, civil-from-days, floating-point-formatting, rate-limiting, abstract-interfaces, line-length-limits]
prerequisites: []
files:
  editable: [logger.hpp]
  readonly: [types.hpp, main.cpp]
flags: ["-std=c++20", "-Wall", "-Wextra"]
limits: { wallMs: 10000, memoryMb: 256 }
requires: []
tiers: { works: true, robust: true, fast: true, clean: true }
gotchas: [escape-everything-json-requires, invalid-utf-8-never-reaches-the-output, floor-division-for-negative-times, shortest-round-trip-doubles, last-duplicate-wins, suppress-repeats-and-say-so, cut-at-a-code-point, children-share-state]
