    text: "Six mistakes: (1) largest has ONE type parameter for two arguments of different types; (2) a dependent type name without `typename`; (3) a concept that is too narrow (what does the 'because' note say about 'double'?); (4) the error is in the standard library, but std::sort needs something that Version does not have; (5) a class template used without its argument; (6) a template argument that is not a compile-time constant."
