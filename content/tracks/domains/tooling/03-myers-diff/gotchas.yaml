v-array-snapshots:
  title: "Save a snapshot of V for each step"
  text: "To rebuild the edit script, backtrack through the V arrays from each step d. Keep one copy per step (or reconstruct from the endpoints), because the single array is overwritten as d grows."
tie-breaking-is-not-unique:
  title: "More than one shortest diff exists"
  text: "Several edit scripts can have the minimum length. The tests expect a particular one: prefer deletions before insertions, and the diagonal when it is free. Follow the specification's tie-break exactly."
deletes-before-inserts:
  title: "Deletions come before insertions"
  text: "In a changed region, print all the `-` lines first and then the `+` lines, as `diff -u` does. Interleaving them makes the patch harder to read and does not match the expected output."
trim-the-common-ends:
  title: "Trim the common prefix and suffix first"
  text: "Lines that are equal at the start and at the end need no search. Trimming them first makes the typical case (a small change in a big file) fast, and the algorithm only sees the differing middle."
hunk-merging:
  title: "Merge hunks whose context overlaps"
  text: "Two changes separated by no more than twice the context lines belong in one hunk. Printing them as two hunks that overlap makes the patch apply wrongly."
omit-count-one:
  title: "Omit a count of 1 in the hunk header"
  text: "A hunk that covers one line is written `@@ -3 +3 @@`, not `@@ -3,1 +3,1 @@`. A count of 0 is written explicitly (`-3,0`), and refers to the line before the change."
  demo:
    bad:
      code: |
        #include <iostream>
        #include <string>

        std::string range(int start, int count) { return std::to_string(start) + "," + std::to_string(count); }

        int main() {
            std::cout << "@@ -" << range(3, 1) << " +" << range(3, 1) << " @@\n";
        }
      out: "@@ -3,1 +3,1 @@\n"
    fix:
      code: |
        #include <iostream>
        #include <string>

        std::string range(int start, int count) {
            return count == 1 ? std::to_string(start) : std::to_string(start) + "," + std::to_string(count);   // omit a count of 1
        }

        int main() {
            std::cout << "@@ -" << range(3, 1) << " +" << range(3, 1) << " @@\n";
        }
      out: "@@ -3 +3 @@\n"
no-newline-at-end:
  title: "A missing final newline is part of the content"
  text: "A last line without a newline is different from the same line with one. Print `\\ No newline at end of file` after it, and compare the lines including that fact."
patch-verifies-the-context:
  title: "A patch must verify the context"
  text: "Applying a hunk only if the context and removed lines match the file protects against applying it to the wrong version. Report a mismatch with the line number, and leave the file unchanged."
