id: core.ownership.raii
title: "Destructors and RAII"
module: core.ownership
type: lesson
estimatedMinutes: 45
concepts: [destructor, raii, scope, destruction-order, stack-unwinding, deleted-functions, noexcept-destructor, std-function, resource-acquisition]
prerequisites: [core.classes.capstone-library]
files:
  editable: [guard.hpp]
  readonly: [main.cpp]
flags: ["-std=c++20", "-Wall", "-Wextra", "-fsanitize=address,undefined"]
limits: { wallMs: 5000, memoryMb: 256 }
requires: [sanitizers]
tiers: { works: true, robust: true, fast: false, clean: false }
gotchas: [cleanup-skipped-on-early-return, cleanup-skipped-on-exception, destructor-throws, copyable-owner, forgotten-delete, delete-array-mismatch, wrong-destruction-order]
