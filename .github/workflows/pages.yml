# Static build for GitHub Pages: the in-browser (WebAssembly) runner, tracking the default branch (`master`).
# Lessons the browser compiler cannot teach are greyed out ("Server needed"), decided by the compatibility check
# (content/wasm-compat.json), so adding content needs no other change here.
name: Pages

on:
  push:
    branches: [master]   # this repository's default branch; a push here verifies and deploys
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            wasm-runner/package-lock.json
            tools/validate-content/package-lock.json

      - name: Install
        run: |
          npm ci --prefix app
          npm ci --prefix wasm-runner
          npm ci --prefix tools/validate-content

      - name: App typecheck and unit tests
        working-directory: app
        run: |
          npx tsc
          npm test

      - name: WASM runner self-test
        run: npm test --prefix wasm-runner

      # Each lesson's mutants/ directories are generated from its mutants.json. If this fails: run `npm run mutants` in
      # tools/validate-content and commit the result.
      - name: Mutant directories match mutants.json
        run: npm run mutants:check --prefix tools/validate-content

      # Re-runs only the lessons whose files, the harness or the runner changed, then insists the committed report
      # matches. If this fails: run `npm run compat` in tools/validate-content and commit content/wasm-compat.json.
      - name: Which lessons run in the browser?
        run: |
          npm run compat --prefix tools/validate-content
          git diff --exit-code content/wasm-compat.json

      # The Gotchas tab: every gotcha a lesson lists has a well-formed explanation (--strict fails on a missing one), and every demo
      # is structurally valid. Running all ~500 demo programs takes too long for every push: do that with `npm run gotchas:demos`
      # (the in-browser compiler) and `npm run validate` (also the Docker runner, for the sanitizer and thread demos).
      - name: Gotcha explanations
        run: node gotchas-check.mjs --strict
        working-directory: tools/validate-content

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            wasm-runner/package-lock.json
      - uses: actions/configure-pages@v6

      - name: Install
        run: |
          npm ci --prefix app
          npm ci --prefix wasm-runner

      - name: Build
        run: npm run build --prefix app
        env:
          VITE_RUNNER: wasm
          BASE_PATH: /${{ github.event.repository.name }}/

      # browsercc ships a 19 MB precompiled header that this app never loads.
      - name: Drop unused toolchain files
        run: rm -f app/dist/assets/stdc__*.pch

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v5
