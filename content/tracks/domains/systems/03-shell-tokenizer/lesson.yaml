id: domain.systems.shell-tokenizer
title: "Tiny Shell Tokenizer"
module: domain.systems
type: challenge
estimatedMinutes: 75
concepts: [tokenizer, state-machine, string-view, quoting, escape-sequences, variable-expansion, error-reporting, lexer, single-pass-parsing, text-processing]
prerequisites: []
files:
  editable: [tokenizer.hpp]
  readonly: [types.hpp, main.cpp]
flags: ["-std=c++20", "-Wall", "-Wextra"]
limits: { wallMs: 10000, memoryMb: 256 }
requires: []
tiers: { works: true, robust: true, fast: true, clean: true }
