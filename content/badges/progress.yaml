- id: test-out-artist
  name: "Test-Out Artist"
  category: progress
  icon: "🎯"
  description: "Pass 3 test-outs."
  rule: { type: lesson-count, where: { type: [test-out], status: complete }, atLeast: 3 }

- id: zero-to-hero
  name: "Zero to Hero"
  category: progress
  icon: "🦸"
  description: "Complete all core modules and 3 Hero Projects."
  rule:
    type: all
    rules:
      - { type: module-complete, module: core.foundations }
      - { type: module-complete, module: core.data-and-memory }
      - { type: module-complete, module: core.classes }
      - { type: module-complete, module: core.ownership }
      - { type: module-complete, module: core.generics }
      - { type: module-complete, module: core.stdlib }
      - { type: module-complete, module: core.inherit }
      - { type: module-complete, module: core.testing }
      - { type: module-complete, module: core.concurrency }
      - { type: module-complete, module: core.performance }
      - { type: lesson-count, where: { module: core.heroes, status: complete }, atLeast: 3 }
