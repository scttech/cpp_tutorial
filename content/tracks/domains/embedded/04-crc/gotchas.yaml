                for (int i = 0; i < 8; ++i) crc = (crc & 0x80000000) ? (crc << 1) ^ 0x04C11DB7 : crc << 1;   // MSB first
            }
            std::cout << std::hex << std::setw(8) << std::setfill('0') << (crc ^ 0xFFFFFFFF) << "\n";
        }
      out: "fc891918\n"
    fix:
      code: |
        #include <cstdint>
        #include <iomanip>
        #include <iostream>
        #include <string>

        int main() {
            std::uint32_t crc = 0xFFFFFFFF;
            for (unsigned char b : std::string("123456789")) {
                crc ^= b;
                for (int i = 0; i < 8; ++i) crc = (crc & 1) ? (crc >> 1) ^ 0xEDB88320 : crc >> 1;   // LSB first, reflected
            }
            std::cout << std::hex << std::setw(8) << std::setfill('0') << (crc ^ 0xFFFFFFFF) << "\n";
        }
      out: "cbf43926\n"
value-must-not-change-the-state:
  title: "Reading the CRC must not change the running state"
  text: "`value()` applies the final XOR to a copy. If it changed the internal register, a second call, or a further `update`, would give a wrong result."
chunked-update-equals-one-shot:
  title: "Chunked updates must equal one big update"
  text: "Feeding \"1234\" then \"56789\" must give the same CRC as \"123456789\" in one call. The register carries over between calls; do not reset it, and do not apply the final XOR in `update`."
