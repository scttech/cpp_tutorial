id: core.concurrency.capstone-job-scheduler
title: "Capstone: Job Scheduler"
module: core.concurrency
type: capstone
estimatedMinutes: 120
concepts: [thread-pool, priority-queue, fifo-within-priority, cancellation, graceful-shutdown, drain-and-discard, wait-idle, statistics, future-and-promise, exception-transport, condition-variables, lock-discipline, no-busy-waiting, shared-ownership-of-tasks]
prerequisites: [core.concurrency.reading-bugs]
files:
  editable: [scheduler.hpp]
  readonly: [main.cpp]
flags: ["-std=c++20", "-Wall", "-Wextra", "-pthread", "-fsanitize=thread"]
limits: { wallMs: 10000, memoryMb: 512 }
requires: [threads, sanitizers]
tiers: { works: true, robust: true, fast: true, clean: true }
