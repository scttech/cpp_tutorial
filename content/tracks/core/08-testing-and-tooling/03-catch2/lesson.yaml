id: core.testing.catch2
title: "Catch2, and choosing a framework"
module: core.testing
type: lesson
estimatedMinutes: 50
concepts: [catch2, test-case, section, require-vs-check, generate, matchers, tags, bdd-style, approx, framework-comparison, doctest, boost-test]
prerequisites: [core.testing.googletest]
files:
  editable: [text_utils_test.cpp]
  readonly: [text_utils.hpp]
flags: ["-std=c++20", "-Wall", "-Wextra"]
libs: [catch2]
grader: variants
limits: { wallMs: 5000, memoryMb: 256 }
requires: [testing-tools]
tiers: { works: true, robust: true, fast: false, clean: true }
gotchas: [section-code-runs-once-per-leaf, require-stops-the-test-case, generate-without-a-loop, throw-with-the-wrong-type, test-names-must-be-unique, tags-forgotten, matcher-header-not-included, one-test-case-checks-everything]
