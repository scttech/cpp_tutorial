id: core.testing.reading-output
title: "Debug challenge: Reading test output"
module: core.testing
type: debug
estimatedMinutes: 50
concepts: [reading-test-failures, googletest-output, expected-vs-actual, wrong-exception-type, sanitizer-report, heap-use-after-free, signed-integer-overflow, dangling-reference, exception-safety, rollback, unique-id, boundary-condition, first-failure-first]
