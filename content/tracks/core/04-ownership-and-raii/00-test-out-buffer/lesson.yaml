id: core.ownership.test-out
title: "Test-out: Buffer class"
module: core.ownership
type: test-out
estimatedMinutes: 40
concepts: [rule-of-five, deep-copy, move-semantics, noexcept-move, swap, self-assignment, resize, bounds-checking, sanitizers, allocation-counting]
prerequisites: [core.classes.capstone-library]
files:
  editable: [buffer.hpp]
  readonly: [main.cpp]
flags: ["-std=c++20", "-Wall", "-Wextra", "-fsanitize=address,undefined"]
limits: { wallMs: 5000, memoryMb: 256 }
requires: [sanitizers]
tiers: { works: true, robust: true, fast: true, clean: true }
gotchas: [shallow-copy, double-free, self-assignment, move-without-noexcept, source-not-emptied, resize-overflow, uninitialized-new-elements, swap-by-copying, malloc-instead-of-new]
