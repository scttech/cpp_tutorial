server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm text/plain application/x-tar;

  # (add_header in a location replaces the ones above it, so the common headers are included in each.)
  include /etc/nginx/conf.d/headers.inc;

  # Built files have a hash in their name: they never change, so the browser may keep them for good.
  location /assets/ {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The page itself must be re-checked every time, so a rebuilt site is picked up.
  location = /index.html {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache" always;
  }

  # The app uses hash routing (/#/lesson/...), so every address is the one page.
  location / {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
